<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - DataAgrin</title>
<link rel="stylesheet" href="style.css?v=3">
<style>
  body { padding: 40px; background: var(--bg); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
  .admin-wrap { width: 100%; max-width: 1600px; background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 32px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
  .farm-card { background: var(--bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
  .farm-name { font-weight: 800; font-size: 1.2rem; color: var(--text); font-family: 'Outfit', sans-serif; }
  .farm-info { color: var(--muted); font-size: 0.95rem; margin-top: 6px; }
  
  .tabs { display: flex; gap: 10px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .tab { padding: 8px 16px; cursor: pointer; border-radius: 8px; font-weight: 600; color: var(--muted); transition: 0.3s; }
  .tab.active { background: var(--primary); color: #fff; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; color: var(--text); font-size: 0.9rem; }
  .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .btn-submit { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
  
  .checkbox-wrapper { text-align: center; vertical-align: middle; }
  .checkbox-wrapper input { cursor: pointer; width: 18px; height: 18px; accent-color: var(--primary); margin: 0 auto; display: block; }
  
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); color: var(--text); }
  th { font-weight: bold; color: var(--muted); }
</style>
</head>
<body class="dark">

<div class="admin-wrap">
  <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div>
      <h1 style="font-family:'Outfit',sans-serif; color:var(--text); font-size:2rem; margin:0;">Painel de Administração</h1>
      <p style="color:var(--muted); margin-top: 4px;">Gerenciamento de Fazendas e Contatos WhatsApp.</p>
    </div>
    <div style="display:flex; gap:12px;">
      <button class="theme-btn" onclick="window.location.href='/'">⬅ Voltar ao Painel</button>
      <button class="theme-btn" onclick="document.body.classList.toggle('light')">☀️ Tema</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('farms')">Fazendas</div>
    <div class="tab" onclick="switchTab('contacts')">Contatos</div>
  </div>

  <!-- ABA: Fazendas -->
  <div id="tab-farms" class="tab-content active">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>Fazendas Cadastradas</h3>
      <button class="btn-submit" onclick="document.getElementById('new-farm-container').style.display='block'">+ Nova Fazenda</button>
    </div>
    
    <div id="new-farm-container" style="display:none; margin-bottom: 20px; overflow-x: auto; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding: 10px;">
      <table style="font-size: 0.85rem; margin:0;">
        <thead>
          <tr>
            <th>Grupo</th>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Status do Telefone</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input type="text" id="f_key" required placeholder="Grupo (ex: jacana)" style="width:140px; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text);"></td>
            <td><input type="text" id="f_name" required placeholder="Nome (ex: Jaçanã)" style="width:160px; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text);"></td>
            <td><input type="text" id="f_phone" placeholder="(11) 90000-0000" oninput="maskPhone(this)" style="width:140px; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text);"></td>
            <td><em>Salvar para editar status</em></td>
            <td>
              <button class="btn-submit" onclick="saveFarm(event)" style="padding:6px 12px; margin-right:4px;">Salvar</button>
              <button class="btn-delete" style="background:#555;" onclick="document.getElementById('new-farm-container').style.display='none';">Cancelar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <table>
      <thead>
        <tr>
          <th>Grupo</th>
          <th>Nome</th>
          <th>Telefone</th>
          <th>Status do Telefone</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="farms-table-body">
      </tbody>
    </table>
  </div>

  <!-- ABA: Contatos -->
  <div id="tab-contacts" class="tab-content">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>Contatos Cadastrados</h3>
      <button class="btn-submit" onclick="document.getElementById('new-contact-container').style.display='block'">+ Novo Contato</button>
    </div>
    
    <div id="new-contact-container" style="display:none; margin-bottom: 20px; overflow-x: auto; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding: 10px;">
      <table style="font-size: 0.85rem; margin:0;">
        <thead id="new-contact-thead">
        </thead>
        <tbody id="new-contact-tbody">
        </tbody>
      </table>
    </div>

    <div style="margin-bottom:15px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <input type="text" id="filter_name" placeholder="Filtrar Nome..." onkeyup="loadContacts()" style="padding:8px; border-radius:6px; background:var(--bg); border:1px solid var(--border); color:var(--text); width: 150px;">
      <input type="text" id="filter_phone" placeholder="Filtrar Telefone..." onkeyup="loadContacts()" style="padding:8px; border-radius:6px; background:var(--bg); border:1px solid var(--border); color:var(--text); width: 150px;">
      <select id="filter_farm" onchange="loadContacts()" style="padding:8px; border-radius:6px; background:var(--bg); color:var(--text); border:1px solid var(--border);">
        <option value="">Todas as Fazendas</option>
      </select>
      <select id="filter_report" onchange="loadContacts()" style="padding:8px; border-radius:6px; background:var(--bg); color:var(--text); border:1px solid var(--border);">
        <option value="">Todos os Relatórios</option>
      </select>
      <button onclick="clearContactFilters()" class="btn-submit" style="background:#555; padding:8px 12px;">Limpar Filtros</button>
    </div>
    <div style="overflow-x: auto;">
      <table style="font-size: 0.85rem;">
        <thead id="contacts-thead">
        </thead>
        <tbody id="contacts-table-body">
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://prx.triskin.tech/api_data/v1';
let farmsList = [];
let currentContacts = [];
const ALL_REPORTS = ['d1', 'daily', 'hour', 'margin', 'market', 'idle', 'productivity', 'revenue', 'top_rates', 'irrigacao', 'interativo'];
const REPORT_LABELS = {
  'd1': 'D1',
  'daily': 'Daily',
  'hour': 'Hour',
  'margin': 'Margem',
  'market': 'Notícias',
  'idle': 'Ociosidade',
  'productivity': 'Produtividade',
  'revenue': 'Faturamento',
  'top_rates': 'Top Rates',
  'irrigacao': 'Irrigação',
  'interativo': 'Interativo'
};

function switchTab(tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + tabId).classList.add('active');
  
  if(tabId === 'farms') loadFarms();
  if(tabId === 'contacts') loadContacts();
}

const FARM_NAME_OVERRIDES = {
  'gjacana': 'Jaçanã',
  'g_jacana': 'Jaçanã',
  'apoloni': 'Boa Sorte',
  'ws': 'Wilson Sierra',
  'fazenda_ws': 'Wilson Sierra',
  'piccini': 'Piccini'
};

function formatFarmName(key, currentName) {
  const k = key.toLowerCase();
  if (FARM_NAME_OVERRIDES[k]) return FARM_NAME_OVERRIDES[k];
  return currentName;
}

function formatPhone(phone) {
  if (!phone) return 'Sem número';
  let p = phone.toString().replace(/\D/g, '');
  if (p.startsWith('55') && p.length > 11) p = p.substring(2);
  if (p.length === 11) return `+55 (${p.substring(0,2)}) ${p.substring(2,7)}-${p.substring(7)}`;
  if (p.length === 10) return `+55 (${p.substring(0,2)}) ${p.substring(2,6)}-${p.substring(6)}`;
  return `+${phone}`;
}

function maskPhone(input) {
  let v = input.value.replace(/\D/g, '');
  if (v.length > 11) v = v.substring(0, 11);
  if (v.length > 2) {
    v = '(' + v.substring(0,2) + ') ' + v.substring(2);
  }
  if (v.length > 10) {
    v = v.substring(0,10) + '-' + v.substring(10);
  }
  input.value = v;
}

async function initAdminPanel() {
  // Populate reports dropdown
  const filterRep = document.getElementById('filter_report');
  ALL_REPORTS.forEach(r => {
    filterRep.innerHTML += `<option value="${r}">${REPORT_LABELS[r]}</option>`;
  });
  await loadFarms();
}

async function setStatus(farmKey, phone, status) {
  try {
    const res = await fetch(API_URL + '/farms/status', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ farm_key: farmKey, phone_number: phone, status: status })
    });
    const data = await res.json();
    if(!data.success) alert("Erro ao salvar: " + data.error);
    else initAdminPanel();
  } catch(e) {
    alert("Erro de conexão.");
  }
}

// ---------------- FARMS CRUD ----------------

async function loadFarms() {
  try {
    const res = await fetch(API_URL + '/farms/overview');
    if(res.ok) {
      const data = await res.json();
      farmsList = (data.farms || []).map(f => {
        f.display_name = formatFarmName(f.farm_key, f.display_name);
        return f;
      });
      renderFarmsTable();
      updateFarmsSelects();
    }
  } catch(e) {
    console.error(e);
  }
}

function renderFarmsTable() {
  document.getElementById('farms-table-body').innerHTML = farmsList.map(f => {
    const st = f.status || 'ok';
    return `
    <tr>
      <td>${f.farm_key}</td>
      <td>${f.display_name}</td>
      <td>${formatPhone(f.phone_number)}</td>
      <td>
        <button class="sbtn ok ${st==='ok'?'on':''}" onclick="setStatus('${f.farm_key}', '${f.phone_number}', 'ok')">🟢 OK</button>
        <button class="sbtn inc ${st==='inc'?'on':''}" onclick="setStatus('${f.farm_key}', '${f.phone_number}', 'inc')">🟡 Instável</button>
        <button class="sbtn ban ${st==='ban'?'on':''}" onclick="setStatus('${f.farm_key}', '${f.phone_number}', 'ban')">🔴 Banido</button>
        <button class="sbtn none ${st==='none'?'on':''}" onclick="setStatus('${f.farm_key}', '${f.phone_number}', 'none')">⚪ Sem Número</button>
      </td>
      <td>
        <button class="btn-delete" style="background:var(--primary);" onclick="editFarm('${f.farm_key}', '${f.display_name}', '${f.phone_number}')">Editar</button>
        <button class="btn-delete" onclick="deleteFarm('${f.farm_key}')">Excluir</button>
      </td>
    </tr>
    `;
  }).join('');
}

function editFarm(key, name, phone) {
  document.getElementById('new-farm-container').style.display = 'block';
  document.getElementById('f_key').value = key;
  document.getElementById('f_name').value = name;
  let v = (phone || '').replace(/\D/g, '');
  if (v.startsWith('55') && v.length > 11) v = v.substring(2);
  if(v.length > 2) v = '(' + v.substring(0,2) + ') ' + v.substring(2);
  if(v.length > 10) v = v.substring(0,10) + '-' + v.substring(10);
  document.getElementById('f_phone').value = v;
  window.scrollTo(0,0);
}

function updateFarmsSelects() {
  const opts = '<option value="">Selecione...</option>' + farmsList.map(f => `<option value="${f.farm_key}">${f.display_name}</option>`).join('');
  // document.getElementById('c_farm').innerHTML = opts; // Removed since c_farm might be recreated
  const filterOpts = '<option value="">Todas as Fazendas</option>' + farmsList.map(f => `<option value="${f.farm_key}">${f.display_name}</option>`).join('');
  document.getElementById('filter_farm').innerHTML = filterOpts;
}

async function saveFarm(e) {
  e.preventDefault();
  let inputPhone = document.getElementById('f_phone').value.replace(/\D/g, '');
  if (inputPhone.length > 0 && !inputPhone.startsWith('55')) {
    inputPhone = '55' + inputPhone;
  }
  
  const payload = {
    farm_key: document.getElementById('f_key').value,
    display_name: document.getElementById('f_name').value,
    source_db_name: '',
    source_schema: '',
    phone_number: inputPhone,
  };
  try {
    const res = await fetch(API_URL + '/farms', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(data.success) {
      alert("Fazenda cadastrada/atualizada!");
      document.getElementById('f_key').value = '';
      document.getElementById('f_name').value = '';
      document.getElementById('f_phone').value = '';
      document.getElementById('new-farm-container').style.display = 'none';
      loadFarms();
    } else alert("Erro: " + data.error);
  } catch(e) { alert("Erro de rede."); }
}

async function deleteFarm(farmKey) {
  if(!confirm(`Excluir fazenda ${farmKey}?`)) return;
  try {
    const res = await fetch(API_URL + '/farms', {
      method: 'DELETE',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ farm_key: farmKey })
    });
    const data = await res.json();
    if(data.success) { loadFarms(); }
    else alert("Erro: " + data.error);
  } catch(e) { alert("Erro de rede."); }
}

// ---------------- CONTACTS CRUD ----------------

function clearContactFilters() {
  document.getElementById('filter_name').value = '';
  document.getElementById('filter_phone').value = '';
  document.getElementById('filter_farm').value = '';
  document.getElementById('filter_report').value = '';
  loadContacts();
}

async function loadContacts() {
  const fk = document.getElementById('filter_farm').value;
  let url = API_URL + '/farms/contacts';
  if(fk) url += '?farm_key=' + fk;
  try {
    const res = await fetch(url);
    if(res.ok) {
      const data = await res.json();
      const rawContacts = data.contacts || [];
      const grouped = {};
      rawContacts.forEach(c => {
        const key = c.phone_number + '_' + c.farm_key;
        if(!grouped[key]) {
          grouped[key] = { ...c };
        } else {
          if (c.report_type !== 'all' && grouped[key].report_type !== 'all') {
             grouped[key].report_type += ',' + c.report_type;
          } else if (c.report_type === 'all') {
             grouped[key].report_type = 'all';
          }
        }
      });
      currentContacts = Object.values(grouped);
      renderContactsTable(fk);
    }
  } catch(e) { console.error(e); }
}

function hasReport(reportType, reportName) {
  if (!reportType) return false;
  if (reportType.toLowerCase() === 'all' || reportType.toLowerCase() === 'todos') return true;
  const list = reportType.split(',').map(r => r.trim().toLowerCase());
  return list.includes(reportName.toLowerCase());
}

async function toggleReport(farmKey, phone, reportName, isChecked, contactName, notes, currentReportType) {
  let list = [];
  if (currentReportType.toLowerCase() === 'all' || currentReportType.toLowerCase() === 'todos') {
    list = [...ALL_REPORTS];
  } else {
    list = currentReportType.split(',').map(r => r.trim()).filter(r => r);
  }
  
  if (isChecked) {
    if (!list.includes(reportName)) list.push(reportName);
  } else {
    list = list.filter(r => r !== reportName);
  }
  
  const newReportType = list.join(',');
  
  const payload = {
    farm_key: farmKey,
    phone_number: phone,
    contact_name: contactName,
    report_type: newReportType,
    notes: notes || ''
  };

  try {
    const res = await fetch(API_URL + '/farms/contacts', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(data.success) {
      // Find and update local state
      const contact = currentContacts.find(c => c.phone_number === phone && (c.farm_key === farmKey || !c.farm_key));
      if(contact) {
        contact.report_type = newReportType;
      }
      renderContactsTable(document.getElementById('filter_farm').value);
    } else {
      alert("Erro ao salvar relatório: " + data.error);
      loadContacts(); // reload to revert checkbox
    }
  } catch(e) { 
    alert("Erro de rede."); 
    loadContacts(); 
  }
}

function renderContactsTable(selectedFarm) {
  // Filters
  const fName = document.getElementById('filter_name').value.toLowerCase();
  const fPhone = document.getElementById('filter_phone').value.replace(/\D/g, '');
  const fRep = document.getElementById('filter_report').value;

  const filtered = currentContacts.filter(c => {
    if (selectedFarm && c.farm_key !== selectedFarm) return false;
    if (fName && !c.contact_name.toLowerCase().includes(fName)) return false;
    if (fPhone && !c.phone_number.includes(fPhone)) return false;
    if (fRep && !hasReport(c.report_type, fRep)) return false;
    return true;
  });

  // Render Thead
  let theadHtml = `<tr>
    <th>Nome</th>
    <th>Telefone</th>
    <th>Fazenda</th>`;
  ALL_REPORTS.forEach(r => {
    theadHtml += `<th style="text-align:center;">${REPORT_LABELS[r]}</th>`;
  });
  theadHtml += `<th>Ações</th></tr>`;
  document.getElementById('contacts-thead').innerHTML = theadHtml;
  document.getElementById('new-contact-thead').innerHTML = theadHtml;

  // Render New Contact Tbody
  const opts = '<option value="">Selecione...</option>' + farmsList.map(f => `<option value="${f.farm_key}">${f.display_name}</option>`).join('');
  let newContactRowHtml = `<tr>
    <td><input type="text" id="c_name" required placeholder="Nome" style="width:120px; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text);"></td>
    <td><input type="text" id="c_phone" required placeholder="(11) 90000-0000" oninput="maskPhone(this)" style="width:140px; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text);"></td>
    <td><select id="c_farm" required style="width:130px; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text);">${opts}</select></td>`;
  ALL_REPORTS.forEach(r => {
    newContactRowHtml += `<td class="checkbox-wrapper"><input type="checkbox" id="c_rep_${r}" value="${r}"></td>`;
  });
  newContactRowHtml += `<td>
      <button class="btn-submit" onclick="saveNewContact()" style="padding:6px 12px; margin-right:4px;">Salvar</button>
      <button class="btn-delete" style="background:#555;" onclick="document.getElementById('new-contact-container').style.display='none';">Cancelar</button>
    </td></tr>`;
  document.getElementById('new-contact-tbody').innerHTML = newContactRowHtml;

  // Render Tbody
  document.getElementById('contacts-table-body').innerHTML = filtered.map(c => {
    let fk = c.farm_key || selectedFarm || 'N/D';
    fk = formatFarmName(fk, fk);
    let rowHtml = `
    <tr>
      <td style="font-weight:bold;">${c.contact_name}</td>
      <td>${formatPhone(c.phone_number)}</td>
      <td>${fk}</td>`;
    
    ALL_REPORTS.forEach(r => {
      const checked = hasReport(c.report_type, r) ? 'checked' : '';
      rowHtml += `<td class="checkbox-wrapper">
        <input type="checkbox" ${checked} onchange="toggleReport('${fk}', '${c.phone_number}', '${r}', this.checked, '${c.contact_name}', '${c.notes || ''}', '${c.report_type}')">
      </td>`;
    });
      
    rowHtml += `
      <td>
        <button class="btn-delete" style="background:var(--primary);" onclick="editContact('${fk}', '${c.phone_number}', '${c.contact_name}', '${c.report_type}', '${c.notes || ''}')">Editar</button>
        <button class="btn-delete" onclick="deleteContact('${fk}', '${c.phone_number}')">Excluir</button>
      </td>
    </tr>`;
    return rowHtml;
  }).join('');
}

function editContact(farmKey, phone, name, type, notes) {
  document.getElementById('new-contact-container').style.display = 'block';
  if(farmKey && farmKey !== 'undefined') document.getElementById('c_farm').value = farmKey;
  
  // Apply mask to phone
  let v = phone.replace(/\D/g, '');
  if (v.startsWith('55') && v.length > 11) v = v.substring(2);
  if(v.length > 2) v = '(' + v.substring(0,2) + ') ' + v.substring(2);
  if(v.length > 10) v = v.substring(0,10) + '-' + v.substring(10);
  
  document.getElementById('c_phone').value = v;
  document.getElementById('c_name').value = name;
  
  // Set checkboxes
  ALL_REPORTS.forEach(r => {
    const cb = document.getElementById(`c_rep_${r}`);
    if (cb) cb.checked = hasReport(type, r);
  });
  
  window.scrollTo(0,0);
}

async function saveNewContact() {
  const nameEl = document.getElementById('c_name');
  const phoneEl = document.getElementById('c_phone');
  const farmEl = document.getElementById('c_farm');
  
  if(!nameEl.value || !phoneEl.value || !farmEl.value) {
    alert("Preencha Nome, Telefone e Fazenda!");
    return;
  }
  
  let inputPhone = phoneEl.value.replace(/\D/g, '');
  if (inputPhone.length > 0 && !inputPhone.startsWith('55')) {
    inputPhone = '55' + inputPhone;
  }
  
  let selectedReports = [];
  ALL_REPORTS.forEach(r => {
    const cb = document.getElementById(`c_rep_${r}`);
    if (cb && cb.checked) selectedReports.push(r);
  });
  const reportTypeStr = selectedReports.length === ALL_REPORTS.length ? 'all' : selectedReports.join(',');
  
  const payload = {
    farm_key: farmEl.value,
    phone_number: inputPhone,
    contact_name: nameEl.value,
    report_type: reportTypeStr,
    notes: ''
  };
  
  try {
    const res = await fetch(API_URL + '/farms/contacts', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(data.success) {
      alert("Contato salvo com sucesso!");
      nameEl.value = '';
      phoneEl.value = '';
      farmEl.value = '';
      ALL_REPORTS.forEach(r => {
        const cb = document.getElementById(`c_rep_${r}`);
        if(cb) cb.checked = false;
      });
      loadContacts();
    } else {
      // Tenta PUT
      const resPut = await fetch(API_URL + '/farms/contacts', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const dataPut = await resPut.json();
      if(dataPut.success) {
        alert("Contato atualizado!");
        nameEl.value = '';
        phoneEl.value = '';
        farmEl.value = '';
        loadContacts();
      } else {
        alert("Erro ao salvar: " + data.error);
      }
    }
  } catch(e) { alert("Erro de rede."); }
}

async function deleteContact(farmKey, phone) {
  if(!farmKey || farmKey === 'undefined') {
    farmKey = prompt("Qual a farm_key deste contato?");
    if(!farmKey) return;
  }
  if(!confirm(`Excluir contato ${phone}?`)) return;
  try {
    const res = await fetch(API_URL + '/farms/contacts', {
      method: 'DELETE',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ farm_key: farmKey, phone_number: phone })
    });
    const data = await res.json();
    if(data.success) loadContacts();
    else alert("Erro: " + data.error);
  } catch(e) { alert("Erro de rede."); }
}

initAdminPanel();
